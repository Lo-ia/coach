</div><script>/* Moteur squelette : cinematique directe, longueurs de segments constantes.
   Une pose = angles articulaires (en degres, 0 = vers la droite, 90 = vers le bas).
   Les angles sont absolus dans le plan sagittal : simple et sans derive. */
var SEG={torse:34,cou:9,tete:8.5,bras:17,avb:16,cuisse:22,tibia:21,pied:8};
function P(a,b){return[a,b]}
function ext(p,ang,len){var r=ang*Math.PI/180;return[p[0]+Math.cos(r)*len,p[1]+Math.sin(r)*len]}
/* pose : {x,y (bassin), t:torse, c:cou, b1,a1 (bras/avant-bras pres), b2,a2 (loin),
           j1,s1,p1 (cuisse/tibia/pied pres), j2,s2,p2 (loin)} */
function squelette(q){
  var pel=P(q.x,q.y);
  var sh=ext(pel,q.t,SEG.torse);
  var nk=ext(sh,q.c===undefined?q.t:q.c,SEG.cou);
  var el1=ext(sh,q.b1,SEG.bras), wr1=ext(el1,q.a1,SEG.avb);
  var el2=ext(sh,q.b2===undefined?q.b1:q.b2,SEG.bras), wr2=ext(el2,q.a2===undefined?q.a1:q.a2,SEG.avb);
  var kn1=ext(pel,q.j1,SEG.cuisse), an1=ext(kn1,q.s1,SEG.tibia), ft1=ext(an1,q.p1===undefined?0:q.p1,SEG.pied);
  var kn2=ext(pel,q.j2===undefined?q.j1:q.j2,SEG.cuisse), an2=ext(kn2,q.s2===undefined?q.s1:q.s2,SEG.tibia),
      ft2=ext(an2,q.p2===undefined?(q.p1===undefined?0:q.p1):q.p2,SEG.pied);
  return {pel:pel,sh:sh,nk:nk,el1:el1,wr1:wr1,el2:el2,wr2:wr2,
          kn1:kn1,an1:an1,ft1:ft1,kn2:kn2,an2:an2,ft2:ft2};
}
var POS={x:1,y:1};
function lerpQ(A,B,u){var o={};
  for(var k in A){var b=(B[k]===undefined)?A[k]:B[k],d=b-A[k];
    if(!POS[k]){while(d>180)d-=360;while(d<-180)d+=360}
    o[k]=A[k]+d*u}
  for(var k2 in B){if(o[k2]===undefined)o[k2]=B[k2]}return o}
function easeIO(u){return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2}
/* mouvement : liste d'images cles + durees relatives ; boucle aller-retour implicite */
function poseAt(mv,ph){
  var K=mv.k, n=K.length;
  var seq=mv.loop?K.concat([K[0]]):K.concat(K.slice(0,-1).reverse());
  var m=seq.length-1, x=ph*m, i=Math.min(Math.floor(x),m-1), u=easeIO(x-i);
  return lerpQ(seq[i],seq[i+1],u);
}
/* --- rendu silhouette --- */
function membre(a,b,w1,w2,col,bd){

  return '<path d="M'+(a[0]+nx*w1).toFixed(1)+' '+(a[1]+ny*w1).toFixed(1)+

   'A'+w1+' '+w1+' 0 0 1 '+(a[0]+nx*w1).toFixed(1)+' '+(a[1]+ny*w1).toFixed(1)+

}
function dessine(mv,ph,opt){
  opt=opt||{};

  s+='<circle cx="'+S.nk[0].toFixed(1)+'" cy="'+S.nk[1].toFixed(1)+'" r="'+SEG.tete+'" fill="'+INK+'" stroke="'+BD+'" stroke-width="1.6"/>';

var FICHES={"traction":["Grand dorsal, grand rond, trapèze inférieur, biceps","Prise pronation (paumes vers l'avant) un peu plus large que les épaules. Suspends-toi bras tendus, épaules relâchées vers le haut.",["Commence par abaisser les omoplates : les épaules descendent avant que les bras ne plient.","Tire les coudes vers le bas et légèrement vers l'arrière, poitrine vers la barre.","Menton au-dessus de la barre, sans tendre le cou.","Redescends en 2 à 3 secondes jusqu'aux bras complètement tendus."],"Inspire en bas, expire en montant.",["Ne pas redescendre bras tendus : tu perds la moitié de l'amplitude.","Balancer les jambes pour s'aider : garde le corps gainé, jambes légèrement devant.","Monter les épaules vers les oreilles au départ."],"Tractions négatives : saute en position haute et descends en 5 secondes.","Tractions archer, puis tempo 4 s de montée et 4 s de descente."],"tractionsup":["Biceps, brachial, grand dorsal","Prise supination (paumes vers toi), largeur d'épaules. Bras tendus en suspension.",["Serre la barre, omoplates basses.","Tire en amenant les coudes vers les côtes, poitrine vers la barre.","Contrôle la descente jusqu'à l'extension complète."],"Expire en montant, inspire en descendant.",["Décoller le menton en avant pour tricher sur la hauteur.","Écarter les coudes : ils doivent rester près du corps."],"Tractions supination assistées avec un pied posé sur une chaise.","Ralentis la descente à 4 secondes, puis passe aux négatives à un bras."],"archer_traction":["Grand dorsal en unilatéral, biceps, gainage","Prise large en pronation. Suspension bras tendus.",["Tire d'un seul côté en amenant le menton vers cette main.","L'autre bras reste presque tendu et glisse le long de la barre.","Redescends au centre, puis alterne à chaque répétition."],"Expire à la montée de chaque côté.",["Laisser le bras tendu se plier : il doit rester quasi droit.","Tourner le buste : garde les hanches face à la barre."],"Tractions classiques avec 4 s de descente.","Réduis l'aide du bras tendu jusqu'à la traction à un bras."],"row":["Grand dorsal, rhomboïdes, trapèze moyen, biceps","Barre à hauteur de hanches. Allonge-toi dessous, saisis la barre largeur d'épaules, talons au sol, corps gainé en ligne droite.",["Serre fesses et abdos : le corps forme une planche de la tête aux talons.","Tire le sternum vers la barre en amenant les coudes vers l'arrière.","Marque une seconde en haut, omoplates serrées.","Redescends bras tendus en contrôle."],"Expire en tirant, inspire en redescendant.",["Laisser les hanches s'affaisser : le corps doit rester rigide.","Tirer avec les bras seulement, sans serrer les omoplates."],"Redresse la barre : plus le corps est vertical, plus c'est facile.","Pieds surélevés sur une chaise pour un corps parfaitement horizontal."],"archer_row":["Grand dorsal en unilatéral, obliques","Comme le row australien, mais mains très écartées sur la barre.",["Tire d'un seul côté, l'épaule vient vers la main.","L'autre bras reste tendu et te sert d'appui.","Alterne les côtés à chaque répétition."],"Expire à chaque tirage.",["Pivoter les hanches pour compenser : reste face au plafond."],"Row australien classique pieds au sol.","Rapproche encore le corps de l'horizontale, ou passe au row à un bras."],"facepull":["Deltoïde postérieur, trapèze moyen, rotateurs de l'épaule","Barre à hauteur de hanches, prise large en pronation, corps gainé sous la barre.",["Tire la barre vers le visage, pas vers le sternum.","Les coudes montent haut, à hauteur des épaules.","Serre les omoplates une seconde, puis redescends lentement."],"Expire en tirant.",["Tirer trop bas : ce sont alors les dorsaux qui travaillent, pas l'arrière d'épaule.","Charger trop : c'est un exercice de qualité, pas de force."],"Corps plus vertical.","Corps plus horizontal et 3 secondes de descente."],"curl_aus":["Biceps, brachial","Barre basse, prise supination largeur d'épaules. Corps incliné vers l'arrière, talons au sol, coudes fixes le long du corps.",["Verrouille les coudes : ils ne bougent pas de toute la série.","Plie uniquement les avant-bras pour amener le front vers la barre.","Redescends en 3 secondes."],"Expire en pliant les bras.",["Laisser les coudes reculer : c'est un row déguisé.","Utiliser les jambes pour s'aider."],"Barre plus haute, corps plus vertical.","Barre au niveau des hanches, corps presque horizontal."],"legraise":["Grand droit, obliques, fléchisseurs de hanche","Suspendu à la barre, bras tendus, corps immobile.",["Bascule légèrement le bassin vers l'arrière pour effacer la cambrure.","Monte les jambes jusqu'à l'horizontale sans élan.","Redescends en 3 secondes sans laisser le corps balancer."],"Expire en montant les jambes.",["Prendre de l'élan avec le buste.","Cambrer le bas du dos en fin de descente."],"Genoux fléchis pendant la montée.","Jambes tendues, puis monte les pieds jusqu'à la barre."],"pompe":["Grand pectoral, triceps, deltoïde antérieur, gainage","Mains au sol un peu plus larges que les épaules, doigts vers l'avant. Corps en planche, fesses serrées.",["Coudes à 45° du corps, pas écartés en croix.","Descends jusqu'à ce que la poitrine frôle le sol.","Pousse le sol loin de toi, sans creuser le bas du dos."],"Inspire en descendant, expire en poussant.",["Laisser les hanches tomber.","Ne descendre qu'à mi-course."],"Mains surélevées sur une chaise ou un banc.","Pompes déclinées, puis archer, puis à un bras."],"pompe_decline":["Haut des pectoraux, deltoïde antérieur, triceps","Pieds sur un banc, mains au sol, corps en ligne droite.",["Plus les pieds sont hauts, plus le haut des pectoraux et les épaules travaillent.","Descends la poitrine vers le sol, coudes à 45°.","Remonte sans casser l'alignement."],"Inspire en descendant, expire en poussant.",["Cambrer le bas du dos.","Laisser la tête plonger en avant."],"Pompes classiques au sol.","Monte les pieds plus haut, jusqu'à la position pike."],"pompe_archer":["Pectoraux en unilatéral, triceps, gainage","Mains très écartées, corps en planche.",["Descends en te déportant sur un bras, l'autre reste tendu au sol.","Le bras tendu ne fait que stabiliser.","Remonte au centre et alterne."],"Expire en poussant.",["Plier le bras d'appui.","Tourner les hanches."],"Pompes déclinées classiques.","Rapproche la main d'appui du corps, jusqu'à la pompe à un bras."],"pike":["Deltoïde antérieur, triceps, trapèze supérieur","Position de pompe puis avance les pieds pour former un V inversé, bassin haut, bras tendus.",["Regarde entre tes mains, dos plat.","Descends le sommet du crâne vers le sol entre les mains.","Coudes vers l'arrière, pas en croix.","Pousse pour revenir bras tendus."],"Inspire en descendant, expire en poussant.",["Descendre vers l'avant des mains au lieu d'entre les mains.","Arrondir le haut du dos."],"Pieds au sol et bassin moins haut.","Pieds sur un banc, puis pompes en poirier au mur."],"hspu":["Deltoïdes, triceps, trapèzes","Poirier contre un mur, mains à 20-25 cm du mur, corps gainé.",["Descends la tête vers le sol en gardant les coudes vers l'avant.","Arrête-toi à l'amplitude que tu contrôles.","Pousse fort pour revenir bras tendus."],"Inspire en descendant, expire en poussant.",["Cambrer le dos pour compenser.","Descendre plus bas que ce que tu peux remonter."],"Pompes pike pieds surélevés.","Augmente l'amplitude, puis éloigne-toi du mur."],"handstand":["Épaules, gainage complet, poignets","Mains à plat au sol, doigts écartés, à 20 cm du mur. Monte les pieds contre le mur.",["Pousse le sol pour grandir les épaules.","Serre les côtes et les fesses : le corps est une ligne, pas une banane.","Regarde entre tes mains, respiration calme."],"Respire normalement, sans bloquer.",["Cambrer le bas du dos.","Laisser les épaules s'affaisser vers les oreilles."],"Gainage bras tendus pieds sur une chaise.","Allonge la durée, puis décolle un pied du mur."],"dips":["Bas des pectoraux, triceps, deltoïde antérieur","Barres parallèles largeur d'épaules. Bras tendus, corps suspendu, genoux fléchis derrière.",["Penche légèrement le buste en avant.","Descends jusqu'à ce que l'épaule arrive au niveau du coude.","Pousse pour revenir bras tendus sans verrouiller sèchement."],"Inspire en descendant, expire en poussant.",["Descendre trop bas si l'épaule n'est pas prête.","Hausser les épaules vers les oreilles en bas."],"Dips sur un banc, pieds au sol.","Descente en 4 secondes, puis dips aux anneaux."],"skull":["Triceps","Barre basse, prise pronation largeur d'épaules, corps incliné, coudes hauts et fixes.",["Seuls les avant-bras bougent : les coudes restent en place.","Descends le front sous la barre en pliant les coudes.","Étends les bras pour revenir."],"Expire en tendant les bras.",["Laisser les coudes descendre : ça devient une pompe.","Cambrer le dos."],"Barre plus haute.","Barre plus basse et 3 secondes de descente."],"hipthrust":["Grand fessier, ischio-jambiers","Haut du dos calé sur un canapé ou un banc bas, un pied au sol genou fléchi à 90°, l'autre jambe tendue ou repliée.",["Rentre les côtes et bascule le bassin : pas de cambrure.","Pousse dans le talon pour monter les hanches jusqu'à l'alignement genou-hanche-épaule.","Serre la fesse une seconde en haut.","Redescends sans poser les fesses au sol."],"Expire en montant, inspire en descendant.",["Monter en cambrant le bas du dos au lieu de serrer la fesse.","Pied trop loin : ce sont les ischios qui prennent tout."],"Pont fessier deux jambes au sol.","Épaules ET pied surélevés, avec 2 secondes de pause en haut."],"pont":["Grand fessier, ischio-jambiers, gainage","Allongé sur le dos, genoux fléchis, pieds à plat près des fesses, bras le long du corps.",["Bascule le bassin pour plaquer le bas du dos.","Pousse dans les talons et monte les hanches.","Tiens la position en serrant les fesses."],"Respiration continue pendant l'isométrie.",["Cambrer au lieu de serrer les fesses.","Pousser sur la pointe des pieds."],"Réduis la durée de maintien.","Une seule jambe, l'autre tendue vers le plafond."],"hipthrust_barre":["Grand fessier, ischio-jambiers","Haut du dos sur un banc, barre sur le pli des hanches avec une protection, pieds à plat.",["Menton rentré, regard vers l'avant.","Pousse dans les talons jusqu'à l'alignement genou-hanche-épaule.","Serre la fesse une seconde, puis redescends en contrôle."],"Expire en montant.",["Hyperextension lombaire en haut.","Décoller les talons."],"Hip thrust au poids du corps.","Augmente la charge en gardant la pause d'une seconde."],"bulgare":["Quadriceps, grand fessier, stabilisateurs de hanche","Debout, pied arrière posé sur une chaise derrière toi, pied avant à environ un grand pas.",["Buste légèrement penché en avant pour cibler la fesse.","Descends en pliant le genou avant, jusqu'à ce que la cuisse soit parallèle au sol.","Le genou avant suit l'axe du pied, il ne rentre pas vers l'intérieur.","Pousse dans le talon avant pour remonter."],"Inspire en descendant, expire en remontant.",["Pied avant trop près : le genou dépasse trop et le quadriceps prend tout.","Se laisser tomber sans contrôle."],"Fentes classiques avec les deux pieds au sol.","Tempo 3-1-1, puis version sautée."],"pistol":["Quadriceps, fessier, équilibre, mobilité de cheville","Debout sur une jambe devant une chaise, l'autre jambe tendue devant toi, bras tendus en avant pour l'équilibre.",["Descends lentement en poussant les hanches vers l'arrière.","Effleure la chaise sans t'asseoir.","Remonte sans élan, en poussant dans le talon."],"Inspire en descendant, expire en remontant.",["Rebondir sur la chaise.","Laisser le genou rentrer vers l'intérieur."],"Chaise plus haute, ou tiens-toi à un appui.","Chaise de plus en plus basse, jusqu'au pistol complet."],"hollow":["Grand droit, transverse, gainage antérieur","Allongé sur le dos, bras tendus au-dessus de la tête, jambes tendues.",["Plaque impérativement le bas du dos au sol : c'est le point clé.","Décolle les omoplates et les talons de quelques centimètres.","Garde la position en respirant."],"Respiration courte et continue, sans bloquer.",["Laisser un espace sous le bas du dos : réduis l'amplitude plutôt.","Tirer sur la nuque."],"Genoux fléchis et bras le long du corps.","Bras tendus au-dessus de la tête, jambes tendues et basses."],"hollowrock":["Grand droit, transverse","Position hollow, corps en forme de banane inversée.",["Garde le corps parfaitement rigide.","Balance d'avant en arrière depuis le haut du dos, sans plier.","Le mouvement vient du bloc entier, pas des jambes."],"Respire au rythme du balancement.",["Plier au niveau des hanches.","Perdre le plaquage lombaire."],"Hollow hold statique.","Bras tendus au-dessus de la tête et amplitude plus grande."],"deadbug":["Transverse, grand droit, anti-cambrure","Sur le dos, bras tendus vers le plafond, hanches et genoux à 90°.",["Plaque le bas du dos au sol et garde-le plaqué tout du long.","Descends lentement un bras et la jambe opposée.","Arrête-toi avant que le dos ne se décolle, puis reviens.","Alterne les côtés."],"Expire en descendant les membres.",["Aller trop loin et cambrer.","Aller trop vite."],"Ne bouge que le bras, en gardant les jambes en place.","Jambes tendues et descente jusqu'à frôler le sol."],"plank":["Transverse, grand droit, épaules","Sur les avant-bras, coudes sous les épaules, pieds largeur de bassin.",["Corps en ligne droite de la tête aux talons.","Rentre les côtes, serre les fesses, pousse le sol avec les avant-bras.","Regard vers le sol, nuque dans l'alignement."],"Respiration ample et continue.",["Fesses trop hautes ou dos creusé.","Retenir sa respiration."],"Genoux au sol.","Allonge la durée, ou décolle un pied."],"sideplank":["Obliques, carré des lombes, moyen fessier","Sur le côté, coude sous l'épaule, pieds superposés.",["Monte la hanche jusqu'à l'alignement cheville-hanche-épaule.","Bras libre tendu vers le plafond.","Tiens sans laisser le bassin redescendre."],"Respiration continue.",["Laisser la hanche s'affaisser.","Rouler vers l'avant."],"Genoux fléchis au sol.","Ajoute une élévation de la jambe du dessus."],"copenhagen":["Adducteurs, obliques, gainage latéral","Sur le côté, coude au sol, jambe du dessus posée sur une chaise.",["Monte le bassin en poussant dans la jambe posée sur la chaise.","La jambe du dessous reste décollée du sol.","Corps aligné, tiens la position."],"Respiration continue.",["Laisser le bassin tomber.","Poser la jambe basse au sol."],"Genou fléchi posé sur la chaise plutôt que la cheville.","Jambe tendue posée par la cheville, durée allongée."],"tirage_vert":["Grand dorsal, grand rond, biceps","Assis, cuisses bloquées sous les cales, prise pronation large. Buste très légèrement incliné en arrière.",["Abaisse d'abord les omoplates, puis tire.","Amène la barre au niveau du haut des pectoraux.","Contrôle la remontée jusqu'aux bras tendus."],"Expire en tirant.",["Se balancer d'avant en arrière.","Tirer derrière la nuque."],"Allège la charge et ralentis.","Traction lestée à la barre fixe."],"ohp":["Deltoïdes antérieur et moyen, triceps","Debout, pieds largeur de bassin, haltères au niveau des épaules, paumes vers l'avant.",["Serre les fesses et rentre les côtes : pas de cambrure.","Pousse à la verticale jusqu'aux bras tendus.","Redescends jusqu'au niveau du menton en contrôle."],"Expire en poussant.",["Cambrer le bas du dos pour aider.","Pousser vers l'avant au lieu de la verticale."],"Assis avec dossier.","Debout à la barre, ou en unilatéral."],"latraise":["Deltoïde moyen","Debout, haltères le long du corps, coudes très légèrement fléchis.",["Monte les bras sur les côtés jusqu'à l'horizontale, pas plus haut.","Le petit doigt légèrement plus haut que le pouce.","Redescends en 3 secondes."],"Expire en montant.",["Prendre de l'élan avec le dos.","Monter au-dessus de l'horizontale : le trapèze prend le relais."],"Charge légère, série longue.","Tempo lent et séries dégressives."],"row_barre":["Grand dorsal, rhomboïdes, trapèze moyen, lombaires","Debout, pieds largeur de bassin, buste penché à environ 45°, dos plat, barre bras tendus.",["Verrouille le dos plat, regard vers le sol un mètre devant.","Tire la barre vers le nombril en amenant les coudes vers l'arrière.","Serre les omoplates, puis redescends en contrôle."],"Expire en tirant.",["Arrondir le dos.","Se redresser pour lancer la barre."],"Rowing à un bras en appui sur un banc.","Augmente la charge en gardant le dos parfaitement plat."],"bench":["Grand pectoral, triceps, deltoïde antérieur","Allongé sur le banc, pieds au sol, omoplates serrées et basses, légère cambrure naturelle.",["Descends la barre au niveau du bas des pectoraux.","Coudes à environ 45° du buste.","Pousse en gardant les omoplates serrées."],"Inspire en descendant, expire en poussant.",["Faire rebondir la barre sur la poitrine.","Décoller les fesses du banc."],"Développé haltères, amplitude plus confortable.","Augmente la charge, ou marque une pause d'une seconde en bas."],"curl_halt":["Biceps, brachial","Debout ou sur banc incliné, haltères en supination, coudes le long du corps.",["Coudes fixes, seuls les avant-bras bougent.","Monte jusqu'à la contraction complète.","Redescends en 3 secondes jusqu'à l'extension."],"Expire en montant.",["Balancer le buste.","Avancer les coudes."],"Charge plus légère, dos contre un mur.","Curl incliné pour étirer davantage, ou tempo lent."],"row_horiz":["Grand dorsal, rhomboïdes, trapèze moyen","Assis, pieds calés, genoux légèrement fléchis, dos droit.",["Garde le buste vertical, sans balancer.","Tire la poignée vers le nombril, coudes près du corps.","Serre les omoplates, puis reviens bras tendus."],"Expire en tirant.",["Utiliser le buste comme un balancier.","Arrondir le dos en fin de course."],"Charge plus légère et tempo contrôlé.","Prise neutre serrée et pause d'une seconde en contraction."],"triceps_poulie":["Triceps","Debout face à la poulie haute, coudes collés au corps.",["Les coudes ne bougent pas de toute la série.","Étends complètement les avant-bras vers le bas.","Remonte lentement jusqu'à 90°."],"Expire en tendant les bras.",["Ouvrir les coudes.","Se pencher en avant pour pousser avec le corps."],"Charge plus légère.","Extension à un bras, ou tempo 3 secondes."],"crunch_poulie":["Grand droit, obliques","À genoux face à la poulie haute, corde derrière la nuque.",["Le mouvement vient de la colonne : tu enroules, tu ne plies pas les hanches.","Amène les coudes vers les cuisses en arrondissant le haut du dos.","Déroule lentement."],"Expire en enroulant.",["Tirer avec les bras.","Basculer depuis les hanches."],"Crunch au sol sans charge.","Augmente la charge en gardant l'enroulement lent."],"mob":["Hanches, chevilles, colonne thoracique","Séquence de mobilité à faire lentement, sans forcer.",["Va jusqu'à la première sensation d'étirement, pas jusqu'à la douleur.","Respire profondément dans chaque position.","Tiens le temps indiqué, puis change de côté."],"Respiration lente et profonde : c'est elle qui permet de gagner de l'amplitude.",["Forcer en rebondissant.","Bloquer sa respiration."],"Réduis l'amplitude et la durée.","Allonge les maintiens et cherche progressivement plus d'amplitude."]};

var figs=[];
function regFig(el,key){figs.push({el:el,k:key})}
var t0=Date.now();
function tick(){var tt=Date.now()-t0,ph=(tt%2600)/2600;for(var i=0;i<figs.length;i++) drawFig(figs[i].el,figs[i].k,ph);if(FT&&FT.el) FT.el.innerHTML=dessine(MVX[FT.k]||MVX.mob,(tt%4600)/4600,{});requestAnimationFrame(tick)}

// ---------- minuteur
var TM={id:null,left:0,tot:0};
function beep(){try{var c=new(window.AudioContext||window.webkitAudioContext)();
 [0,.18].forEach(function(d,i){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);
 o.frequency.value=i?1046:784;g.gain.setValueAtTime(.001,c.currentTime+d);
 g.gain.exponentialRampToValueAtTime(.35,c.currentTime+d+.02);
 g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d+.16);
 o.start(c.currentTime+d);o.stop(c.currentTime+d+.18)})}catch(e){}}
function fmt(s){var m=Math.floor(s/60);return m+':'+((s%60)<10?'0':'')+(s%60)}
function paintTimer(){var d=document.getElementById('disp');
 d.textContent=TM.id?fmt(TM.left):(TM.left?fmt(TM.left):'—:—');
 d.className='disp'+(TM.id?' run':'');
 document.getElementById('btog').textContent=TM.id?'Arrêter':'Repos 90 s';
 document.getElementById('btog').className=TM.id?'stop':''}
function startTimer(sec){ if(TM.id){clearInterval(TM.id);TM.id=null}
 TM.left=sec;TM.tot=sec;paintTimer();
 TM.id=setInterval(function(){TM.left--;if(TM.left<=0){clearInterval(TM.id);TM.id=null;beep();TM.left=0}paintTimer()},1000)}
function togTimer(){ if(TM.id){clearInterval(TM.id);TM.id=null;TM.left=0;paintTimer()} else startTimer(90) }

// ---------- etat
var cur=new Date(); var sel=0;
function sessionsOf(date){var k=iso(date);return PLAN.filter(function(s){return s.date===k})}
function go(n){cur.setDate(cur.getDate()+n);sel=0;render()}
function goDate(s){cur=parse(s);sel=0;render()}
function goToday(){cur=new Date();sel=0;render()}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function exoHTML(e,cls){
 return '<button class="exo" onclick="fiche(\''+esc(e.a)+'\',\''+esc(e.n).replace(/'/g,'&#39;')+'\')">'+
  '<svg viewBox="0 0 130 110" data-a="'+esc(e.a)+'"></svg><div class="txt">'+
  '<div class="n">'+esc(e.n)+'<span class="loupe">détail</span></div><div class="s">'+esc(e.s)+'</div>'+
  (e.f?'<div class="f">'+esc(e.f)+'</div>':'')+'</div></button>'}

function render(){
 var app=document.getElementById('app'), ss=sessionsOf(cur), h='';
 var jour=JOURS[cur.getDay()], dd=cur.getDate()+' '+MOIS[cur.getMonth()];
 document.getElementById('dj').textContent=jour+' '+dd;
 var t=new Date(); var isT=iso(t)===iso(cur);
 var sub=isT?"aujourd'hui":((ss.length?('semaine '+ss[0].sem+' · '):'')+'toucher pour revenir à aujourd\'hui');
 document.getElementById('dsub').textContent=sub;
 // onglets
 var tb='';
 ['course','callis','salle'].forEach(function(p){
   var idx=-1; ss.forEach(function(s,i){if(s.prog===p)idx=i});
   if(idx>=0) tb+='<button class="tab '+PROGC[p]+(idx===sel?' on':'')+'" onclick="sel='+idx+';render()">'+PROGN[p]+'</button>';
   else tb+='<span class="tab off">'+PROGN[p]+'</span>';
 });
 document.getElementById('tabs').innerHTML=ss.length?tb:'';
 if(!ss.length){app.innerHTML='<div class="empty">Repos.<br><small>Rien de prévu ce jour-là.</small></div>';figs=[];return}
 if(sel>=ss.length)sel=0;
 var s=ss[sel], c=PROGC[s.prog];
 h+='<h1>'+esc(s.nom)+'<span class="badge">S'+s.sem+'</span></h1>';
 h+='<div class="meta">'+s.h+(s.lieu?' · '+esc(s.lieu):'')+'</div>';
 h+='<div class="intro '+c+'">'+esc(s.intro)+'</div>';
 if(s.prog==='course'){
   h+='<h2>Déroulé de la séance</h2><div class="tl">';
   s.blocs.forEach(function(b){
     h+='<div class="st k-'+b.k+'"><div class="bar"></div><div><div class="t">'+esc(b.t)+'</div>'+
        '<div class="d">'+esc(b.d)+'</div></div></div>'});
   h+='</div><div class="foot">Sur la montre : la séance est déjà chargée. L\'échauffement et le retour au calme attendent que <b>tu</b> appuies sur LAP ; entre les répétitions, tout s\'enchaîne tout seul.</div>';
 } else {
   var key='chk_'+s.date+'_'+s.prog, done=LS.get(key,{});
   s.ss.forEach(function(pair,pi){
     h+='<h2>Superset '+(pi+1)+' — '+s.tours+' tours</h2><div class="card '+c+'">';
     h+='<div class="head"><span>Enchaîne A puis B sans repos, puis 90 s</span><span class="rounds">';
     for(var r=0;r<s.tours;r++){var id=pi+'-'+r;
       h+='<button class="rd'+(done[id]?' done':'')+'" onclick="tog(\''+key+'\',\''+id+'\')">'+(r+1)+'</button>'}
     h+='</span></div>';
     pair.forEach(function(e,ei){h+='<div class="pair">'+exoHTML(e,c)+'</div>'});
     h+='</div>';
   });
   h+='<h2>Finition</h2>';
   s.acc.forEach(function(e,i){
     var lk='log_'+s.prog+'_'+e.n, prev=LS.get(lk,'');
     h+='<div class="card '+c+'">'+exoHTML(e,c)+
        '<div class="log"><span>Réalisé</span><input placeholder="ex. 3 × 14" value="'+esc(LS.get('log_'+s.date+'_'+e.n,''))+
        '" oninput="saveLog(\''+s.date+'\',\''+esc(e.n).replace(/'/g,"")+'\',this.value)">'+
        (prev?'<span class="prev">dernière fois : '+esc(prev)+'</span>':'')+'</div></div>'});
   if(s.mob&&s.mob.length){h+='<h2>Mobilité — 15 min</h2>';
     s.mob.forEach(function(e){h+='<div class="card '+c+'">'+exoHTML(e,c)+'</div>'})}
   h+='<div class="foot"><b>100 % poids du corps</b> pour la callisthénie : la progression vient du bras de levier, du travail unilatéral et du tempo, jamais de la charge. Shake de protéines après la séance ; créatine 3-5 g tous les jours.</div>';
 }
 // semaines
 h+='<h2>Aller à une semaine</h2><div class="weeks">';
 for(var w=1;w<=12;w++){var f=PLAN.filter(function(x){return x.sem===w})[0];
   h+='<button class="wk'+(f&&s.sem===w?' on':'')+'" onclick="goDate(\''+f.date+'\')">S'+w+
      '<small>'+parse(f.date).getDate()+'/'+(parse(f.date).getMonth()+1)+'</small></button>'}
 h+='</div>';
 app.innerHTML=h;
 figs=[];
 Array.prototype.forEach.call(app.querySelectorAll('svg[data-a]'),function(el){regFig(el,el.getAttribute('data-a'))});
}
function tog(key,id){var o=LS.get(key,{});o[id]=!o[id];LS.set(key,o);
 if(o[id])startTimer(90); render()}
function saveLog(date,n,v){LS.set('log_'+date+'_'+n,v);LS.set('log_perf_'+n,v)}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
window.onload=function(){render();tick();paintTimer();
 var x=null;document.addEventListener('touchstart',function(e){x=e.touches[0].clientX},{passive:true});
 document.addEventListener('touchend',function(e){if(x===null)return;var d=e.changedTouches[0].clientX-x;
   if(Math.abs(d)>70)go(d>0?-1:1);x=null},{passive:true})}

var FT=null;
function fiche(a,nom){
  var f=FICHES[a]||FICHES.mob;
  var h='<div class="sheet-in"><div class="sh-top"><b>'+esc(nom)+'</b>'+
    '<button class="x" onclick="fermeFiche()" aria-label="Fermer">&#10005;</button></div>'+
    '<svg class="big" viewBox="0 0 130 110" id="bigfig"></svg>'+
    '<div class="sh-body">'+
    '<h3>Muscles travaillés</h3><p>'+esc(f[0])+'</p>'+
    '<h3>Mise en place</h3><p>'+esc(f[1])+'</p>'+
    '<h3>Exécution</h3><ol>'+f[2].map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>'+
    '<h3>Respiration</h3><p>'+esc(f[3])+'</p>'+
    '<h3>Erreurs fréquentes</h3><ul class="err">'+f[4].map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'+
    '<div class="vari"><div><b>Plus facile</b><span>'+esc(f[5])+'</span></div>'+
    '<div><b>Plus dur</b><span>'+esc(f[6])+'</span></div></div>'+
    '</div></div>';
  var d=document.getElementById('sheet'); d.innerHTML=h; d.classList.add('on');
  document.body.style.overflow='hidden';
  FT={el:document.getElementById('bigfig'),k:a};
}
function fermeFiche(){var d=document.getElementById('sheet');d.classList.remove('on');d.innerHTML='';
  document.body.style.overflow='';FT=null}
</script></body></html>
